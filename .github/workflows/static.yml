<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Points Per Hour Tracker</title>

  <style>
    :root {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: #17202a;
      background: #f4f6f8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .wrap {
      max-width: 1050px;
      margin: 0 auto;
      padding: 28px 18px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .sub {
      margin: 5px 0 0;
      color: #68727d;
    }

    .date {
      font-weight: 700;
      color: #4d5863;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 5px 22px #0000000d;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 15px 16px;
      text-align: left;
      border-bottom: 1px solid #edf0f2;
    }

    th {
      font-size: 13px;
      color: #6b7480;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .points {
      width: 100px;
      padding: 10px 11px;
      border: 1px solid #cfd5db;
      border-radius: 9px;
      font-size: 16px;
    }

    .points:focus {
      outline: 2px solid #8bb8ff;
      border-color: #5d9df5;
    }

    .rate {
      font-weight: 800;
      font-size: 18px;
    }

    .rank {
      font-weight: 800;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .tile {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 5px 22px #0000000d;
    }

    .label {
      font-size: 12px;
      color: #737e89;
      text-transform: uppercase;
    }

    .value {
      font-size: 24px;
      font-weight: 800;
      margin-top: 4px;
    }

    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #6f7983;
    }

    .saved {
      color: #18864b;
      font-weight: 700;
      opacity: 0;
      transition: 0.2s;
    }

    .saved.show {
      opacity: 1;
    }

    @media (max-width: 700px) {
      header {
        display: block;
      }

      .date {
        margin-top: 10px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .card {
        overflow-x: auto;
      }

      table {
        min-width: 650px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>
      <div>
        <h1>📊 Points Per Hour</h1>
        <p class="sub">Advisor performance tracker</p>
      </div>

      <div class="date" id="today"></div>
    </header>


    <div class="card">

      <table>

        <thead>
          <tr>
            <th>Rank</th>
            <th>Advisor</th>
            <th>Hours Worked</th>
            <th>Points Sold ✏️</th>
            <th>Points / Hour</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>

      </table>

    </div>


    <div class="summary">

      <div class="tile">
        <div class="label">Total Points</div>
        <div class="value" id="total">0</div>
      </div>

      <div class="tile">
        <div class="label">Total Hours</div>
        <div class="value" id="hours">0</div>
      </div>

      <div class="tile">
        <div class="label">Team Points / Hour</div>
        <div class="value" id="teamRate">0.00</div>
      </div>

    </div>


    <p class="note">
      Only the <b>Points Sold</b> fields are editable.
      Changes are saved in this browser automatically.
      <span class="saved" id="saved">Saved ✓</span>
    </p>

  </div>


  <script>

    /*
      EDIT YOUR ADVISORS HERE

      name = advisor's name
      hours = hours worked
      points = points sold
    */

    const advisors = [

      {
        name: "Sarah",
        hours: 7.5,
        points: 42
      },

      {
        name: "Jack",
        hours: 6,
        points: 31
      },

      {
        name: "Amy",
        hours: 8,
        points: 52
      },

      {
        name: "Tom",
        hours: 7,
        points: 29
      },

      {
        name: "Leah",
        hours: 6.5,
        points: 38
      }

    ];


    /*
      Save data in the browser
    */

    const storageKey = "points-per-hour-tracker";

    const storedData =
      JSON.parse(
        localStorage.getItem(storageKey) || "null"
      );


    if (storedData) {

      advisors.forEach((advisor, index) => {

        if (storedData[index] != null) {

          advisor.points =
            Number(storedData[index]) || 0;

        }

      });

    }


    /*
      Display today's date
    */

    document.getElementById("today").textContent =
      new Intl.DateTimeFormat(
        "en-GB",
        {
          dateStyle: "full"
        }
      ).format(new Date());


    /*
      Draw the table
    */

    function render() {

      const sortedAdvisors = advisors

        .map((advisor, index) => ({

          ...advisor,

          index,

          rate:
            advisor.hours
              ? advisor.points / advisor.hours
              : 0

        }))

        .sort(
          (a, b) =>
            b.rate - a.rate
        );


      document.getElementById("rows").innerHTML =

        sortedAdvisors.map(
          (advisor, position) => `

            <tr>

              <td class="rank">
                #${position + 1}
              </td>

              <td>
                <b>${advisor.name}</b>
              </td>

              <td>
                ${advisor.hours}
              </td>

              <td>

                <input
                  class="points"
                  type="number"
                  min="0"
                  step="1"
                  value="${advisor.points}"
                  data-index="${advisor.index}"
                  aria-label="Points for ${advisor.name}"
                >

              </td>

              <td class="rate">

                ${advisor.rate.toFixed(2)}

              </td>

            </tr>

          `
        )
        .join("");


      /*
        Calculate team totals
      */

      const totalPoints =
        advisors.reduce(
          (total, advisor) =>
            total + advisor.points,
          0
        );


      const totalHours =
        advisors.reduce(
          (total, advisor) =>
            total + advisor.hours,
          0
        );


      const teamRate =
        totalHours
          ? totalPoints / totalHours
          : 0;


      document.getElementById("total")
        .textContent = totalPoints;


      document.getElementById("hours")
        .textContent = totalHours.toFixed(1);


      document.getElementById("teamRate")
        .textContent = teamRate.toFixed(2);


      /*
        Allow points to be edited
      */

      document
        .querySelectorAll(".points")
        .forEach(input => {

          input.addEventListener(
            "input",
            event => {

              const index =
                Number(
                  event.target.dataset.index
                );


              advisors[index].points =
                Math.max(
                  0,
                  Number(event.target.value) || 0
                );


              /*
                Save points
                */

              localStorage.setItem(

                storageKey,

                JSON.stringify(
                  advisors.map(
                    advisor =>
                      advisor.points
                  )
                )

              );


              /*
                Recalculate everything
              */

              render();


              /*
                Show saved message
              */

              const saved =
                document.getElementById("saved");

              saved.classList.add("show");


              clearTimeout(
                window.saveTimer
              );


              window.saveTimer =
                setTimeout(
                  () =>
                    saved.classList.remove(
                      "show"
                    ),
                  1000
                );

            }

          );

        });

    }


    /*
      Start the tracker
    */

    render();

  </script>

</body>
</html>
